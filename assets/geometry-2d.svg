<g transform="translate(0,165)"><rect class="panel" x="3" y="3" width="204" height="159" rx="8"/><text class="title" x="12" y="20">Rectangle</text><g class="shape" transform="translate(6,20)"><rect x="22" y="40" width="142" height="68"/><path class="measure" d="M22 108 L164 40"/><text x="90" y="125">a</text><text x="9" y="77">b</text><text x="94" y="66">d</text></g></g>
<g transform="translate(210,165)"><rect class="panel" x="3" y="3" width="204" height="159" rx="8"/><text class="title" x="12" y="20">Parallelogram</text><g class="shape" transform="translate(6,20)"><path d="M24 105 H146 L171 37 H49 Z"/><path class="measure" d="M49 37 V105"/><text x="85" y="123">a</text><text x="51" y="77">h</text><text x="155" y="80">b</text></g></g>
<g transform="translate(420,165)"><rect class="panel" x="3" y="3" width="204" height="159" rx="8"/><text class="title" x="12" y="20">Rhombus</text><g class="shape" transform="translate(6,20)"><path d="M94 20 L164 72 L94 124 L24 72 Z"/><path class="measure" d="M94 20 V124 M24 72 H164"/><text x="99" y="68">d₁</text><text x="54" y="68">d₂</text><text x="127" y="39">a</text></g></g>
