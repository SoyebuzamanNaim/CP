<g transform="translate(0,330)"><rect class="panel" x="3" y="3" width="204" height="159" rx="8"/><text class="title" x="12" y="20">Regular n-gon</text><g class="shape" transform="translate(6,20)"><path d="M93 20 L155 49 L140 113 L47 113 L31 49 Z"/><path class="measure" d="M93 72 V113 M93 72 L155 49"/><text x="98" y="99">t</text><text x="98" y="127">a</text><text x="124" y="77">R</text></g></g>
