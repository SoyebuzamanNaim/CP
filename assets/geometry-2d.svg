<svg xmlns="http://www.w3.org/2000/svg" width="840" height="660" viewBox="0 0 840 660" role="img" aria-label="Common plane shapes">
<style>svg{background:#fff;font-family:Arial,sans-serif}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1}.shape{fill:#e0f2fe;stroke:#0f172a;stroke-width:2.2;stroke-linejoin:round}.shape .measure{fill:none;stroke:#e11d48;stroke-width:1.5;stroke-dasharray:4 3}.shape .center{fill:#e11d48;stroke:none}.shape text{fill:#9f1239;font-size:13px;font-weight:bold;stroke:none}.title{fill:#0f172a;font-size:13px;font-weight:bold}</style>
<g transform="translate(0,0)"><rect class="panel" x="3" y="3" width="204" height="159" rx="8"/><text class="title" x="12" y="20">Triangle</text><g class="shape" transform="translate(6,20)"><path d="M25 105 L162 105 L112 22 Z"/><path class="measure" d="M112 22 V105"/><text x="74" y="123">b</text><text x="116" y="70">h</text><text x="23" y="63">a</text><text x="145" y="65">c</text></g></g>
<g transform="translate(210,0)"><rect class="panel" x="3" y="3" width="204" height="159" rx="8"/><text class="title" x="12" y="20">Right triangle</text><g class="shape" transform="translate(6,20)"><path d="M30 105 H158 L30 24 Z"/><path class="measure" d="M30 94 h11 v11"/><text x="90" y="123">a</text><text x="15" y="65">b</text><text x="105" y="62">c</text></g></g>
<g transform="translate(420,0)"><rect class="panel" x="3" y="3" width="204" height="159" rx="8"/><text class="title" x="12" y="20">Equilateral triangle</text><g class="shape" transform="translate(6,20)"><path d="M96 20 L30 110 H162 Z"/><path class="measure" d="M96 20 V110"/><text x="93" y="127">a</text><text x="100" y="72">h</text></g></g>
